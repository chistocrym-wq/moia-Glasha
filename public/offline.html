<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5964EA">
  <title>Глаша — нет сети</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#25283a;background:#f6f7fb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}
    main{max-width:520px;background:#fff;border:1px solid #e9eaf0;border-radius:28px;padding:32px;box-shadow:0 18px 60px rgba(46,52,85,.08);text-align:center}
    img{width:116px;height:116px;object-fit:contain}
    h1{margin:10px 0 8px;font-size:28px}
    p{margin:0;color:#72778a;line-height:1.6}
    button{margin-top:22px;border:0;border-radius:14px;background:#5964ea;color:white;padding:12px 18px;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Глаша ждёт интернет</h1>
    <p>Нет подключения к интернету. Сохранённые онлайн-функции временно недоступны.</p>
    <button type="button" onclick="location.reload()">Попробовать снова</button>
  </main>
</body>
</html>
