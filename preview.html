<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Глаша — интерактивный прототип</title>
<style>
:root{--bg:#f7f5fb;--card:#fff;--text:#20212a;--muted:#777986;--line:#e8e4ee;--accent:#5c63d8;--blue:#eaf2ff;--pink:#fff0f4;--green:#edf8f0;--yellow:#fff7df;--lav:#f1efff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{padding:24px 16px;border-right:1px solid var(--line);background:#fbfafc;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 8px 24px}.logo{width:44px;height:44px;border-radius:15px;background:#222;color:#fff;display:grid;place-items:center;font:700 24px Georgia}.brand b{font-size:19px}.brand small{display:block;color:var(--muted);margin-top:2px}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;padding:11px 12px;border-radius:14px;text-align:left;display:flex;gap:10px;align-items:center;cursor:pointer;color:#43444c}.nav button:hover,.nav button.active{background:#efedff;color:#454cc6}.ico{width:28px;height:28px;border-radius:9px;background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
.privacy{margin:24px 8px 0;padding:12px;border-radius:14px;background:#f1f6f1;font-size:12px;color:#64706a;line-height:1.45}
.main{padding:26px 30px 46px;max-width:1300px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:20px}.top h1{margin:4px 0 0;font-size:29px}.eyebrow{margin:0;color:#7d7f8c;font-size:12px;text-transform:uppercase;letter-spacing:.12em}.avatar{width:55px;height:55px;border-radius:50%;overflow:hidden;background:#f0e9df;border:3px solid white;box-shadow:0 5px 18px #0001}.sprite{width:100%;height:100%;background-image:url('public/glasha/glasha-sprite.webp');background-size:500% 200%;background-position:100% 100%;background-repeat:no-repeat}
.hero{background:linear-gradient(135deg,#fff 0%,#f5f2ff 60%,#f8e9ee 100%);border:1px solid var(--line);border-radius:28px;display:grid;grid-template-columns:1.4fr .6fr;overflow:hidden;min-height:370px}.heroCopy{padding:36px}.hero h2{font-size:42px;line-height:1.05;margin:12px 0}.hero h2 span{color:#666edb}.hero p{color:var(--muted);font-size:17px}.heroPic{position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:320px}.heroPic .sprite{width:290px;height:360px;background-position:100% 100%;filter:drop-shadow(0 18px 24px #4b3b5a22)}
.chip{display:inline-flex;padding:6px 10px;background:white;border:1px solid var(--line);border-radius:999px;font-size:12px}.cmd{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px;margin-top:24px}.cmd input{min-width:0;flex:1;border:0;outline:0;padding:12px}.cmd button{border:0;border-radius:12px;padding:0 16px;cursor:pointer}.mic{width:46px;background:#eef1ff}.send{background:var(--accent);color:#fff}.hints{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.hints button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer;color:#60626c}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat{padding:18px;border-radius:19px;border:1px solid var(--line)}.stat span{font-size:12px;color:#666}.stat b{display:block;font-size:28px;margin-top:7px}.pink{background:var(--pink)}.blue{background:var(--blue)}.green{background:var(--green)}.yellow{background:var(--yellow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px}.panel h3{margin:3px 0 15px;font-size:20px}.row{display:flex;gap:11px;align-items:center;padding:13px 0;border-top:1px solid #f0edf2}.row:first-of-type{border-top:0}.check{width:22px;height:22px;border:2px solid #a9acbb;border-radius:50%;background:#fff;cursor:pointer}.row.done b{text-decoration:line-through;color:#999}.grow{flex:1}.grow small{display:block;color:#8b8d98;margin-top:3px}.pill{font-size:11px;padding:5px 8px;border-radius:999px;background:#f1f0f8}.sectionHero{display:grid;grid-template-columns:1fr 220px;background:#fff;border:1px solid var(--line);border-radius:24px;min-height:230px;margin-bottom:16px;overflow:hidden}.sectionHero>div:first-child{padding:26px}.sectionHero h2{font-size:32px;margin:10px 0}.sectionHero p{color:var(--muted);max-width:700px;line-height:1.5}.sectionPic{display:flex;align-items:flex-end;justify-content:center;background:#faf7f4}.sectionPic .sprite{width:190px;height:230px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);background:#fff;border-radius:18px;padding:18px;min-height:130px}.card b{display:block;margin:8px 0}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{border:1px solid var(--line);background:white;border-radius:18px;padding:18px 8px;min-height:100px;cursor:pointer}.quick button span{display:block;font-size:28px;margin-bottom:8px}.quick button:hover{background:#f4f2ff}.money{display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}.money small{display:block;color:var(--muted);margin-top:3px}.add{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.toast{position:fixed;right:22px;bottom:22px;background:#252635;color:#fff;padding:12px 16px;border-radius:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
.mobile{display:none}
@media(max-width:860px){.app{display:block}.side{display:none}.main{padding:18px 14px 82px}.top h1{font-size:23px}.hero{grid-template-columns:1fr}.heroCopy{padding:24px}.hero h2{font-size:31px}.heroPic{min-height:250px}.heroPic .sprite{height:280px;width:230px}.stats{grid-template-columns:1fr 1fr}.grid2,.cards{grid-template-columns:1fr}.sectionHero{grid-template-columns:1fr 130px}.sectionPic .sprite{width:130px;height:210px}.quick{grid-template-columns:repeat(3,1fr)}.mobile{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);z-index:5}.mobile button{border:0;background:#fff;padding:10px 4px;font-size:11px;color:#6d6f79}.mobile button span{display:block;font-size:19px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="logo">Г</div><div><b>Глаша</b><small>мой личный помощник</small></div></div><nav class="nav" id="nav"></nav><div class="privacy">🔒 Личное пространство<br>Этот preview хранит изменения только внутри открытой страницы.</div></aside>
<main class="main"><header class="top"><div><p class="eyebrow">Твоя Глаша</p><h1 id="title">Привет! Что держим под контролем?</h1></div><div class="avatar"><div class="sprite" id="avatarSprite"></div></div></header><div id="view"></div></main>
<nav class="mobile" id="mobile"></nav></div><div class="toast" id="toast"></div>
<script>
const sections=[
{id:'home',label:'Главная',icon:'⌂',sub:'Всё важное сейчас',sprite:9},
{id:'tasks',label:'Мои дела',icon:'✓',sub:'Личное и бытовое',sprite:9},
{id:'work',label:'Работа',icon:'▣',sub:'Проекты и задачи',sprite:5},
{id:'calendar',label:'Календарь',icon:'◫',sub:'События и напоминания',sprite:2},
{id:'finance',label:'Финансы',icon:'₽',sub:'Личные и рабочие',sprite:1},
{id:'health',label:'Здоровье',icon:'♡',sub:'Самочувствие и цикл',sprite:3},
{id:'learning',label:'Обучение',icon:'◉',sub:'Языки и развитие',sprite:0},
{id:'travel',label:'Поездки',icon:'✈',sub:'Билеты и планы',sprite:2},
{id:'documents',label:'Документы',icon:'▤',sub:'Всё под рукой',sprite:1},
{id:'quick',label:'Быстрый доступ',icon:'⌘',sub:'Ссылки и приложения',sprite:9},
{id:'advisor',label:'Советчик',icon:'?',sub:'Найти и разобраться',sprite:8},
{id:'chat',label:'Поговорить',icon:'✦',sub:'Выгрузить мысли',sprite:4}
];
let active='home';
let tasks=[
{id:1,title:'Оплатить интернет',area:'Личное',time:'12:00',done:false},
{id:2,title:'Позвонить маме',area:'Личное',time:'19:00',done:false},
{id:3,title:'Подготовить презентацию',area:'Работа',time:'15:00',done:false},
{id:4,title:'Проверить договор',area:'Работа',time:'',done:false}
];
let expenses=[{title:'Продукты',amount:48.2,area:'Личные'},{title:'Аптека',amount:32.5,area:'Личные'},{title:'Подписка сервиса',amount:19,area:'Рабочие'}];
let notes=[];
const events=[['Встреча с клиентом','Сегодня · 10:00','Работа'],['Записаться к врачу','Сегодня · 14:30','Здоровье'],['Тренировка','Сегодня · 18:00','Здоровье']];
function spriteStyle(n){const c=n%5,r=Math.floor(n/5);return 'background-position:'+c*25+'% '+r*100+'%'}
function nav(){const el=document.getElementById('nav');el.innerHTML=sections.map(s=>'<button data-id="'+s.id+'" class="'+(active===s.id?'active':'')+'"><span class="ico">'+s.icon+'</span><span><b>'+s.label+'</b><small style="display:block">'+s.sub+'</small></span></button>').join('');el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.id)));const m=document.getElementById('mobile');m.innerHTML=sections.slice(0,4).map(s=>'<button data-id="'+s.id+'"><span>'+s.icon+'</span>'+s.label+'</button>').join('')+'<button data-id="quick"><span>•••</span>Ещё</button>';m.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.id)))}
function go(id){active=id;render();scrollTo({top:0,behavior:'smooth'})}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function processCommand(t){t=t.trim();if(!t)return;const l=t.toLowerCase();if(/потрат|заплат|купил|купила/.test(l)){const m=t.match(/\d+[.,]?\d*/);expenses.push({title:t,amount:m?+m[0].replace(',','.') :0,area:/работ|фирм|клиент/.test(l)?'Рабочие':'Личные'});toast('Глаша записала расход ✓')}else if(/билет|поезд|самол|отел/.test(l)){toast('Сохранила в поездки ✈')}else if(/врач|лекар|цикл|здоров/.test(l)){toast('Записала в здоровье ♡')}else if(/напом|надо|сделать|позвон|отправ|провер/.test(l)){tasks.push({id:Date.now(),title:t,area:/работ|клиент|договор|проект/.test(l)?'Работа':'Личное',time:'',done:false});toast('Добавила в дела ✓')}else{notes.push(t);toast('Сохранила во входящие мысли ✦')}render()}
function hero(section){return '<section class="sectionHero"><div><span class="chip">'+section.label+'</span><h2>'+head(section.id)+'</h2><p>'+desc(section.id)+'</p></div><div class="sectionPic"><div class="sprite" style="'+spriteStyle(section.sprite)+'"></div></div></section>'}
function head(id){return({tasks:'Ничего не держим в голове',work:'Помню, где мы остановились',calendar:'Все даты в одном месте',finance:'Деньги без тумана',health:'Забота о себе тоже дело',learning:'Учиться — без поиска по рабочему столу',travel:'Билеты, брони и планы вместе',documents:'Важное — под рукой',quick:'Открыть нужное за секунду',advisor:'Спроси — разберёмся',chat:'Можно сказать всё как есть'})[id]||''}
function desc(id){return({tasks:'Личные и рабочие дела можно смотреть вместе или отдельно.',work:'Задачи, проекты и последняя актуальная точка по каждому вопросу.',calendar:'Напоминания, встречи, врачи, билеты и дедлайны.',finance:'Говори сумму и назначение — Глаша сохранит расход в нужный дневник.',health:'Самочувствие, цикл, врачи, лекарства и показатели.',learning:'Курсы, ссылки, тренажёры, заметки и текущий прогресс.',travel:'Билеты и поездки собраны в одном месте.',documents:'Документы, сроки действия, договоры, счета и важные файлы.',quick:'Банк, билеты, почта, карты и всё, что часто нужно открыть.',advisor:'Поиск, сравнение вариантов, объяснения и помощь с документами.',chat:'Разговор, мысли, идеи и ситуации — без необходимости всё помнить.'})[id]||''}
function taskRows(filter){return tasks.filter(t=>!filter||t.area===filter).map(t=>'<div class="row '+(t.done?'done':'')+'"><button class="check" data-task="'+t.id+'">'+(t.done?'✓':'')+'</button><div class="grow"><b>'+t.title+'</b><small>'+t.area+(t.time?' · '+t.time:'')+'</small></div><span class="pill">'+(t.done?'готово':'в работе')+'</span></div>').join('')}
function home(){const pers=tasks.filter(t=>!t.done&&t.area==='Личное').length,work=tasks.filter(t=>!t.done&&t.area==='Работа').length,total=expenses.reduce((s,x)=>s+x.amount,0);return '<section class="hero"><div class="heroCopy"><span class="chip">Сегодня</span><h2>Выгружай всё из головы.<br><span>Я разложу по местам.</span></h2><p>Просто скажи или напиши Глаше то, что не хочешь держать в голове.</p><form class="cmd" id="cmd"><button type="button" class="mic" id="mic">🎙</button><input id="command" placeholder="Например: в понедельник оплатить страховку…"><button class="send">Запомнить</button></form><div class="hints"><button data-hint="Потратила 45 евро на продукты">+ расход</button><button data-hint="Напомни завтра позвонить врачу">+ напоминание</button><button data-hint="По работе проверить договор">+ работа</button></div></div><div class="heroPic"><div class="sprite"></div></div></section><div class="stats"><div class="stat pink"><span>Личных дел</span><b>'+pers+'</b></div><div class="stat blue"><span>По работе</span><b>'+work+'</b></div><div class="stat green"><span>Событий</span><b>'+events.length+'</b></div><div class="stat yellow"><span>Расходов</span><b>'+total.toFixed(0)+' €</b></div></div><div class="grid2"><section class="panel"><div class="headrow"><div><p class="eyebrow">Сегодня</p><h3>Что требует внимания</h3></div><button class="add" data-go="tasks">Все дела</button></div>'+taskRows()+'</section><section class="panel"><p class="eyebrow">Глаша заметила</p><h3>Не потерять</h3><div class="card" style="background:var(--lav)"><b>✦ '+(notes.length?notes.length+' мыслей ждут разбора':'Входящие мысли пусты')+'</b><p>'+(notes.length?'Можно разобрать их по делам, планам и идеям.':'Говори всё, что приходит в голову — Глаша сохранит.')+'</p></div><div class="card" style="margin-top:10px;background:var(--pink)"><b>♡ Время для себя</b><p>Глаша будет следить, чтобы работа не съедала всё пространство.</p></div></section></div>'}
function sectionView(s){if(s.id==='tasks'||s.id==='work')return hero(s)+'<section class="panel"><div class="headrow"><h3>'+(s.id==='work'?'Рабочие задачи':'Все дела')+'</h3><button class="add" id="addTask">+ Добавить</button></div>'+taskRows(s.id==='work'?'Работа':null)+'</section>';
if(s.id==='calendar')return hero(s)+'<div class="grid2"><section class="panel"><h3>Сентябрь 2026</h3><div class="cards" style="grid-template-columns:repeat(7,1fr)">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс',21,22,23,24,25,26,27].map(x=>'<div class="card" style="min-height:auto;padding:11px;text-align:center">'+x+'</div>').join('')+'</div></section><section class="panel"><h3>Ближайшее</h3>'+events.map(e=>'<div class="row"><span>●</span><div><b>'+e[0]+'</b><small>'+e[1]+' · '+e[2]+'</small></div></div>').join('')+'</section></div>';
if(s.id==='finance')return hero(s)+'<div class="stats"><div class="stat blue"><span>Всего расходов</span><b>'+expenses.reduce((a,x)=>a+x.amount,0).toFixed(0)+' €</b></div><div class="stat green"><span>Личные</span><b>'+expenses.filter(x=>x.area==='Личные').reduce((a,x)=>a+x.amount,0).toFixed(0)+' €</b></div><div class="stat pink"><span>Рабочие</span><b>'+expenses.filter(x=>x.area==='Рабочие').reduce((a,x)=>a+x.amount,0).toFixed(0)+' €</b></div><div class="stat yellow"><span>Записей</span><b>'+expenses.length+'</b></div></div><section class="panel"><div class="headrow"><h3>Операции</h3><button class="add" id="addExpense">+ Расход</button></div>'+expenses.map(x=>'<div class="money"><div><b>'+x.title+'</b><small>'+x.area+'</small></div><b>-'+x.amount.toFixed(2)+' €</b></div>').join('')+'</section>';
if(s.id==='health')return hero(s)+'<div class="cards">'+[['☻','Самочувствие','Сегодня ты в порядке'],['◌','Цикл','День 14 из 28'],['✚','Лекарства','3 активных напоминания'],['⌁','Врачи','2 ближайшие записи'],['◒','Сон','Добавить данные'],['↗','Показатели','Вес, давление, активность']].map(x=>'<div class="card"><span style="font-size:25px">'+x[0]+'</span><b>'+x[1]+'</b><p>'+x[2]+'</p></div>').join('')+'</div>';
if(s.id==='learning')return hero(s)+'<div class="grid2"><section class="panel"><p class="eyebrow">Немецкий язык</p><h3>A1 → A2</h3><div style="height:10px;background:#eee;border-radius:8px;overflow:hidden"><span style="display:block;width:68%;height:100%;background:#6369da"></span></div><p style="color:var(--muted)">Прогресс 68%</p><div class="row"><b>Словарь</b><span class="pill">15 мин</span></div><div class="row"><b>Грамматика</b><span class="pill">20 мин</span></div><button class="add" style="width:100%">Продолжить занятие</button></section><section class="panel"><h3>Мои материалы</h3><div class="cards" style="grid-template-columns:1fr"><button class="card">↗ Тренажёр языка</button><button class="card">▤ Мои заметки</button><button class="card">◎ Полезные ссылки</button></div></section></div>';
if(s.id==='travel')return hero(s)+'<div class="cards">'+[['✈','Билеты','Добавлять поездки и брони'],['▣','Отели','Хранить подтверждения'],['◫','Календарь поездок','Все даты вместе'],['▤','Документы','Паспорт, страховка, визы']].map(x=>'<div class="card"><span style="font-size:25px">'+x[0]+'</span><b>'+x[1]+'</b><p>'+x[2]+'</p></div>').join('')+'</div>';
if(s.id==='documents')return hero(s)+'<section class="panel">'+[['Паспорт','Срок до 2031'],['ВНЖ','Срок до 2028'],['Медицинские документы','Анализы и заключения'],['Договоры','Рабочие и личные'],['Счета и квитанции','Оплаченные и будущие']].map(x=>'<div class="row"><span>▤</span><div><b>'+x[0]+'</b><small>'+x[1]+'</small></div></div>').join('')+'</section>';
if(s.id==='quick')return hero(s)+'<div class="quick">'+[['🏦','Банк'],['▣','Госуслуги'],['✉','Почта'],['◫','Календарь'],['✈','Билеты'],['⌖','Карты'],['文','Переводчик'],['A1','Тренажёр'],['▶','Видео'],['💬','Telegram'],['☁','Диск'],['+','Добавить']].map(x=>'<button data-toast="'+x[1]+' — сюда подключим реальную ссылку"><span>'+x[0]+'</span><b>'+x[1]+'</b></button>').join('')+'</div>';
if(s.id==='advisor')return hero(s)+'<section class="panel"><h3>Что нужно найти или решить?</h3><p style="color:var(--muted)">В полноценной версии Глаша сможет искать информацию, сравнивать варианты, разбирать документы и помогать готовить вопросы юристу.</p><div class="hints"><button data-toast="Будущий поиск">Найти информацию</button><button data-toast="Будущий разбор документа">Разобрать документ</button><button data-toast="Будущее сравнение">Сравнить варианты</button></div></section>';
return hero(s)+'<div class="grid2"><section class="panel"><h3>Можно просто выговориться</h3><p style="color:var(--muted)">Глаша сохранит важное и поможет потом разложить всё на факты, решения и следующие шаги.</p><button class="add" data-toast="Разговор с Глашей появится в следующем этапе">Начать разговор</button></section><section class="panel"><h3>Входящие мысли</h3>'+(notes.length?notes.map(n=>'<div class="row">'+n+'</div>').join(''):'<p style="color:var(--muted)">Пока пусто. Добавь любую мысль на главном экране.</p>')+'</section></div>'}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.addEventListener('click',()=>go(x.dataset.go)));document.querySelectorAll('[data-toast]').forEach(x=>x.addEventListener('click',()=>toast(x.dataset.toast)));document.querySelectorAll('[data-task]').forEach(x=>x.addEventListener('click',()=>{const t=tasks.find(a=>a.id==x.dataset.task);if(t)t.done=!t.done;render()}));const f=document.getElementById('cmd');if(f)f.addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('command');processCommand(i.value);i.value=''});document.querySelectorAll('[data-hint]').forEach(x=>x.addEventListener('click',()=>{document.getElementById('command').value=x.dataset.hint}));const at=document.getElementById('addTask');if(at)at.addEventListener('click',()=>{const v=prompt('Что добавить?');if(v){tasks.push({id:Date.now(),title:v,area:active==='work'?'Работа':'Личное',time:'',done:false});render()}});const ae=document.getElementById('addExpense');if(ae)ae.addEventListener('click',()=>{const v=prompt('На что потратили?');const a=parseFloat((prompt('Сумма')||'').replace(',','.'));if(v&&Number.isFinite(a)){expenses.push({title:v,amount:a,area:'Личные'});render()}});const mic=document.getElementById('mic');if(mic)mic.addEventListener('click',()=>toast('В живом приложении подключим голосовой ввод 🎙'))}
function render(){nav();const s=sections.find(x=>x.id===active);document.getElementById('title').textContent=active==='home'?'Привет! Что держим под контролем?':s.label;document.getElementById('avatarSprite').style.cssText=spriteStyle(s.sprite);document.getElementById('view').innerHTML=active==='home'?home():sectionView(s);bind()}
render();
</script>
</body></html>
