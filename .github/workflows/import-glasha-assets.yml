name: Import Glasha visual assets

on:
  push:
    branches:
      - prototype/glasha-v1
    paths:
      - .github/workflows/import-glasha-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/glasha-v1

      - name: Download source PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/glasha-src public/glasha/characters public/icons
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000e9e08211ba21688483366e54&ts=497226&p=fs&cid=1&sig=7312a5762f767401c3ac3bf3e1ead3eb7ebef254bbbd8cd700827f2bf8a27f05&v=0' -o /tmp/glasha-src/ideas.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_000000008f0881f485f3ef9e4ba9237b&ts=497226&p=fs&cid=1&sig=601be18027c884c12bc2ae2b18f25dd8eba7117b174103f5902162232d145101&v=0' -o /tmp/glasha-src/home.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000f5cc81f4b63d52cb90a174ae&ts=497226&p=fs&cid=1&sig=5d69e50356c98877038d257036d5505b0ac7bc07c8f3ec0b16ff91b7d332ad79&v=0' -o /tmp/glasha-src/quick.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_000000001f2881f4b41bbc9bcfe62610&ts=497226&p=fs&cid=1&sig=43eb68593c48990482cea1c201090cdbd7d78c0ada92710fd3250fec25331124&v=0' -o /tmp/glasha-src/cooking.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000ee94822fa5d8b398ed20a112&ts=497226&p=fs&cid=1&sig=ceb66b277ac0a9cb725f0b8c063ee143ddc5a3bd0eb4b56159f4c0b3fcf473e5&v=0' -o /tmp/glasha-src/cat.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_000000006abc820ca91c0a4eb1a94c76&ts=497226&p=fs&cid=1&sig=ba92729e74449aa051344c089d5f2e3261981bfc1860932ea9f05cebb81fabda&v=0' -o /tmp/glasha-src/work.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000475881f4af8be6b047206405&ts=497226&p=fs&cid=1&sig=2e76d0f6167d36e4fb86e89b7cbaa6832ab2041ae50bb0721cf7bad5847f1681&v=0' -o /tmp/glasha-src/travel.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000c514820da21e0e638e4269f3&ts=497226&p=fs&cid=1&sig=71a773a3d9b7363aaefdb8111683ad027101268f4071bbcd824f4ed6545c77ed&v=0' -o /tmp/glasha-src/health.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_0000000062a08210ad7473d10978052e&ts=497226&p=fs&cid=1&sig=270f811c58d3d10978052e37005a6d6035d3010c91b7f717bf74cceb6b15&v=0' -o /tmp/glasha-src/learning.png
          curl -L --fail --retry 2 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -H 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' -e 'https://chatgpt.com/' 'https://chatgpt.com/backend-api/estuary/content?id=file_00000000a9ec8211afb7e3937a561323&ts=497226&p=fs&cid=1&sig=26f44388a210d9ffb2b2b2548b550f27a064e3d512a53fff608960d4934cd9ea&v=0' -o /tmp/glasha-src/documents.png

      - name: Prepare web assets
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path('/tmp/glasha-src')
          out = Path('public/glasha/characters')
          out.mkdir(parents=True, exist_ok=True)

          for name in ['ideas','home','quick','cooking','cat','work','travel','health','learning','documents']:
              image = Image.open(src / f'{name}.png').convert('RGBA')
              if image.width < 700 or image.height < 1500:
                  raise RuntimeError(f'{name}: source image unexpectedly small: {image.size}')
              image.save(out / f'{name}.webp', 'WEBP', quality=92, method=6)

          # High-quality interface avatar from the same final Glasha visual language.
          # This is a clean face crop, never stretched.
          source = Image.open(src / 'learning.png').convert('RGBA')
          crop = source.crop((115, 20, 680, 585))
          crop.save('public/glasha/avatar.webp', 'WEBP', quality=95, method=6)

          avatar = crop
          for size, filename, padding in [
              (192, 'icon-192.png', 12),
              (512, 'icon-512.png', 28),
              (512, 'icon-maskable.png', 90),
              (180, 'apple-touch-icon.png', 10),
          ]:
              canvas = Image.new('RGBA', (size, size), (239, 236, 255, 255))
              fitted = avatar.copy()
              fitted.thumbnail((size - 2*padding, size - 2*padding), Image.Resampling.LANCZOS)
              canvas.alpha_composite(fitted, ((size-fitted.width)//2, (size-fitted.height)//2))
              canvas.convert('RGB').save(Path('public/icons') / filename, 'PNG', optimize=True)
          PY

      - name: Commit prepared assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/glasha/characters public/glasha/avatar.webp public/icons/*.png
          git commit -m 'feat: import high-quality Glasha character artwork'
          git push origin HEAD:prototype/glasha-v1
