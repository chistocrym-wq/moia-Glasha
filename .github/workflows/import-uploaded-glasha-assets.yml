name: Import uploaded Glasha assets

on:
  push:
    branches:
      - prototype/glasha-v1
    paths:
      - glasha-assets-ready.zip

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prototype/glasha-v1
          fetch-depth: 1

      - name: Import approved artwork
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f glasha-assets-ready.zip ]; then
            echo "Asset package already imported."
            exit 0
          fi

          unzip -o glasha-assets-ready.zip -d .

          test -s public/glasha/avatar.webp
          for name in home work health learning travel documents quick ideas cat cooking; do
            test -s "public/glasha/characters/$name.webp"
          done
          for icon in icon-192.png icon-512.png icon-maskable.png apple-touch-icon.png; do
            test -s "public/icons/$icon"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .asset-import/src/components/GlashaCharacter.tsx src/components/GlashaCharacter.tsx
          cp .asset-import/src/app/page.tsx src/app/page.tsx
          cp .asset-import/src/app/globals.css src/app/globals.css
          cp .asset-import/src/app/layout.tsx src/app/layout.tsx
          cp .asset-import/public/manifest.webmanifest public/manifest.webmanifest
          cp .asset-import/public/sw.js public/sw.js

          if grep -RqE 'glasha-sprite|glashaCrop|glashaSheet|currentSprite|sprite=' src public/manifest.webmanifest public/sw.js; then
            echo "Old sprite implementation is still referenced."
            exit 1
          fi

          git add public/glasha public/icons src public/manifest.webmanifest public/sw.js
          git rm -r glasha-assets-ready.zip .asset-import
          git commit -m 'feat: integrate approved Glasha artwork and PWA icons'
          git push origin HEAD:prototype/glasha-v1
